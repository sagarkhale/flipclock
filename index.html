<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Flip Clock">
<meta name="theme-color" content="#0a0a0a">
<title>Flip Clock</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="32x32" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext y='28' font-size='26'%3E%E2%8F%B0%3C/text%3E%3C/svg%3E">
<style>
  :root{
    --fs:140px;--bg-opacity:0.60;
    --clock-color:#fff;--clock-font:'SF Pro Display',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Helvetica,Arial,sans-serif;--clock-bg:#141414;
    --date-color:#ddd;--date-font:'SF Pro Text',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Helvetica,Arial,sans-serif;--date-bg:transparent;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;font-family:var(--date-font);background:#0a0a0a;color:#fff;-webkit-tap-highlight-color:transparent}
  .bg{position:fixed;inset:0;z-index:-1;background-size:cover;background-position:center;background-color:#0a0a0a;filter:brightness(0.5)contrast(1.1);transition:background-image .5s,filter .3s,opacity .3s}
  .bg::after{content:"";position:fixed;inset:0;z-index:0;background:transparent;pointer-events:none}
  .main{position:relative;z-index:1;display:grid;grid-template-columns:3fr 2fr;height:100vh;width:100vw}
  .left-panel{display:grid;grid-template-rows:3fr 2fr;padding:0}
  .image-panel{position:relative;background-size:cover;background-position:center;display:flex;align-items:center;justify-content:center}
  .image-panel::after{content:"";position:absolute;inset:0;background:rgba(0,0,0,var(--bg-opacity));pointer-events:none;z-index:1}
  .panel-label{position:absolute;top:16px;left:16px;z-index:2;font-size:15px;font-weight:600;color:rgba(255,255,255,.7);letter-spacing:.5px}
  .clock-date-panel{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:30px}
  .date-display{font-size:34px;font-weight:500;letter-spacing:3px;color:var(--date-color);background:var(--date-bg);padding:6px 14px;border-radius:8px;margin-bottom:34px;font-family:var(--date-font)}
  .clock-panel{display:flex;align-items:center;gap:12px}
  .right-panel{display:grid;grid-template-rows:3fr 2fr}
  .moon-panel{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px;border-left:1px solid rgba(255,255,255,0.08)}
  .moon-icon{font-size:96px;line-height:1;margin-bottom:14px}
  .moon-label{font-size:24px;font-weight:600;color:#ddd;margin-bottom:6px}
  .moon-illum{font-size:16px;color:#888}
  .moon-side{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;margin-bottom:30px}
  .sun-row{display:flex;flex-direction:row;gap:30px;width:100%;justify-content:center}
  .sun-item{display:flex;flex-direction:column;align-items:center;gap:6px;flex:1}
  .sun-label{font-size:15px;font-weight:600;color:#aaa;margin-bottom:2px}
  .sun-value{font-size:32px;font-weight:700;color:#fff}
  .bottom-panel{position:relative;display:grid;grid-template-columns:1fr 1fr;border-left:1px solid rgba(255,255,255,0.08);border-top:1px solid rgba(255,255,255,0.08)}
  .data-card{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px;border-right:1px solid rgba(255,255,255,0.06);border-bottom:1px solid rgba(255,255,255,0.06)}
  .data-label{font-size:15px;font-weight:600;color:#aaa;letter-spacing:.5px;text-transform:uppercase;margin-bottom:10px}
  .data-value{font-size:42px;font-weight:700;color:#fff;margin-bottom:6px}
  .data-sub{font-size:14px;color:#888}
  .digit-group{position:relative;width:94px;height:142px;display:flex;align-items:center;justify-content:center}
  .card{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .55s cubic-bezier(.35,0,.3,1);transform-origin:center}
  .face{position:absolute;inset:0;backface-visibility:hidden;display:flex;align-items:center;justify-content:center;font-size:var(--fs);font-weight:700;color:var(--clock-color);background:var(--clock-bg);border:1px solid #242424;border-radius:10px;box-shadow:inset 0 0 45px rgba(0,0,0,.7),0 12px 30px rgba(0,0,0,.5);font-family:var(--clock-font)}
  .front{z-index:2}
  .back{z-index:1;transform:rotateX(180deg)}
  .axle{position:absolute;top:50%;left:0;right:0;height:5px;background:#000;z-index:4;transform:translateY(-50%);border-radius:2px;opacity:.35}
  .colon{font-size:var(--fs);line-height:1;color:var(--clock-bg);margin:0 8px;font-weight:700;font-family:var(--clock-font)}
  .ampm{margin-top:16px;font-size:22px;font-weight:600;color:var(--clock-color);letter-spacing:2px;font-family:var(--clock-font)}
  .secs{margin-top:10px;font-size:16px;font-weight:500;color:var(--clock-color);letter-spacing:2px;font-family:var(--clock-font)}
  .btn-gear{position:fixed;bottom:20px;left:20px;z-index:55;width:48px;height:48px;background:rgba(255,255,255,.1);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.18);border-radius:50%;color:#fff;display:grid;place-items:center;cursor:pointer;font-size:22px}
  .btn-gear:hover{background:rgba(255,255,255,.2)}
  .install-banner{position:fixed;top:12px;left:50%;transform:translateX(-50%);background:rgba(255,255,255,.08);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.14);border-radius:12px;padding:7px 14px;color:#fff;font-size:13px;z-index:30;display:none;gap:10px;align-items:center}
  .install-banner button{background:#fff;color:#000;border:none;border-radius:8px;padding:5px 14px;font-size:12px;font-weight:700;cursor:pointer}
  #scale-container{width:1024px;height:768px;position:absolute;transform-origin:top left;left:50%;top:50%;overflow:visible}
  .settings{position:fixed;top:0;left:0;width:50%;height:100%;z-index:60;background:rgba(10,10,10,.95);backdrop-filter:blur(20px);display:none;flex-direction:column}
  .settings.open{display:flex}
  .settings-head{display:flex;justify-content:space-between;align-items:center;padding:18px 24px;border-bottom:1px solid rgba(255,255,255,.12)}
  .settings-head h2{font-size:17px;font-weight:600;letter-spacing:-.3px}
  .settings-close{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);border-radius:10px;color:#fff;width:36px;height:36px;display:grid;place-items:center;font-size:18px;cursor:pointer}
  .settings-scroll{flex:1;overflow-y:auto;padding:24px}
  .sec-title{font-size:12px;font-weight:700;color:#888;text-transform:uppercase;letter-spacing:1px;margin:0 0 14px 0;padding-bottom:8px;border-bottom:1px solid rgba(255,255,255,.08)}
  .row{display:flex;flex-direction:column;gap:8px;margin-bottom:20px}
  .row label{font-size:13px;color:#ccc}
  .row select,.row input[type=color],.row input[type=range],.row input[type=file]{width:100%;font-size:13px}
  .row input[type=color]{height:34px;border:none;background:transparent;cursor:pointer}
  .row input[type=range]{accent-color:#fff}
  .reset-btn{margin-top:8px;background:#333;border:1px solid rgba(255,255,255,.2);border-radius:10px;color:#fff;padding:10px 16px;font-size:13px;cursor:pointer}
  .reset-btn:hover{background:#444}
  @media (max-width:768px){
    .main{grid-template-columns:1fr;grid-template-rows:1fr 1fr}
    .right-panel{grid-template-rows:1fr 1fr;border-top:1px solid rgba(255,255,255,.08);border-left:none}
    .bottom-panel{grid-template-columns:1fr 1fr;border-left:none;border-top:1px solid rgba(255,255,255,.08)}
  }
</style>
</head>
<body>
<div id="scale-container">
<div class="bg" id="bg"></div>

<div class="install-banner" id="banner"><span>Add Flip Clock to Home Screen</span><button id="installBtn">Install</button></div>

<div class="btn-gear" id="gear" title="Settings">⚙️</div>

<div class="settings" id="settings">
  <div class="settings-head">
    <h2>Settings</h2>
    <div class="settings-close" id="settingsClose">✕</div>
  </div>
  <div class="settings-scroll">
    <div class="sec-title">Background</div>
    <div class="row">
      <label>Image / Camera</label>
      <input type="file" id="bgPicker" accept="image/*" multiple capture="environment">
    </div>
    <div class="row">
      <label>Slideshow</label>
      <select id="bgSlideshow">
        <option value="off">Off</option>
        <option value="5">5 seconds</option>
        <option value="10">10 seconds</option>
        <option value="20">20 seconds</option>
        <option value="30">30 seconds</option>
      </select>
    </div>
    <div class="row">
      <label>Opacity</label>
      <input type="range" id="bgOpacity" min="0" max="100" value="60">
    </div>

    <div class="sec-title">Clock</div>
    <div class="row">
      <label>Font Color</label>
      <input type="color" id="clockColor" value="#ffffff">
    </div>
    <div class="row">
      <label>Font Type</label>
      <select id="clockFont">
        <option value="'SF Pro Display',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Helvetica,Arial,sans-serif">SF Pro</option>
        <option value="'Helvetica Neue',Helvetica,Arial,sans-serif">Helvetica</option>
        <option value="'Times New Roman',Times,serif">Times New Roman</option>
        <option value="'Courier New',Courier,monospace">Courier New</option>
        <option value="'Verdana',sans-serif">Verdana</option>
        <option value="'Georgia',serif">Georgia</option>
      </select>
    </div>
    <div class="row">
      <label>Card Background</label>
      <input type="color" id="clockBg" value="#141414">
    </div>
    <div class="row">
      <label>Time Format</label>
      <select id="timeFormat">
        <option value="12">12 Hour</option>
        <option value="24">24 Hour</option>
      </select>
    </div>

    <div class="sec-title">Date</div>
    <div class="row">
      <label>Font Color</label>
      <input type="color" id="dateColor" value="#dddddd">
    </div>
    <div class="row">
      <label>Font Type</label>
      <select id="dateFont">
        <option value="'SF Pro Text',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Helvetica,Arial,sans-serif">SF Pro</option>
        <option value="'Helvetica Neue',Helvetica,Arial,sans-serif">Helvetica</option>
        <option value="'Times New Roman',Times,serif">Times New Roman</option>
        <option value="'Courier New',Courier,monospace">Courier New</option>
        <option value="'Verdana',sans-serif">Verdana</option>
        <option value="'Georgia',serif">Georgia</option>
      </select>
    </div>
    <div class="row">
      <label>Background</label>
      <input type="color" id="dateBg" value="transparent">
    </div>
    <div class="row">
      <label>Date Format</label>
      <select id="dateFormat">
        <option value="DD:MM:YYYY">DD:MM:YYYY</option>
        <option value="DD:MM:YY">DD:MM:YY</option>
        <option value="DD:Month:YYYY">DD:Month:YYYY</option>
        <option value="Month DD, YYYY">Month DD, YYYY</option>
        <option value="YYYY:MM:DD">YYYY:MM:DD</option>
        <option value="MM/DD/YYYY">MM/DD/YYYY</option>
        <option value="DD-MM-YYYY">DD-MM-YYYY</option>
      </select>
    </div>

    <div style="display:flex;gap:10px;margin-top:14px;">
      <button id="settingsSave" style="background:#333;border:1px solid rgba(255,255,255,.2);border-radius:10px;color:#fff;padding:10px 16px;font-size:13px;cursor:pointer;flex:1">Save</button>
      <button class="reset-btn" id="settingsReset">Reset All</button>
    </div>
    <div style="margin-top:20px;">
      <button id="settingsCloseBottom" style="width:100%;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);border-radius:10px;color:#fff;padding:10px 16px;font-size:13px;cursor:pointer">Close Settings</button>
    </div>
  </div>
</div>

<div class="main">
    <div class="left-panel">
    <div class="image-panel" id="imagePanel"><div class="panel-label">Background Image</div></div>
    <div class="clock-date-panel"><div class="panel-label">Time &amp; Date</div>
      <div class="date-display" id="date">22:11:2026</div>
      <div class="clock-panel" id="clock"></div>
      <div class="ampm" id="ampm">AM</div>
    </div>
    </div>
    <div class="right-panel">
    <div class="moon-panel"><div class="panel-label">Moon Phase &amp; Sun Times</div>
      <div class="moon-side"><div class="moon-icon" id="moonIcon">🌕</div><div class="moon-label" id="moonLabel">Full Moon</div><div class="moon-illum" id="moonIllum">100%</div></div>
      <div class="sun-row">
        <div class="sun-item"><div class="sun-label">Sunrise</div><div class="sun-value" id="sunriseValue">--:--</div></div>
        <div class="sun-item"><div class="sun-label">Sunset</div><div class="sun-value" id="sunsetValue">--:--</div></div>
      </div>
    </div>
    <div class="bottom-panel"><div class="panel-label">Temperature &amp; Humidity</div>
      <div class="data-card"><div class="data-label">Temperature</div><div class="data-value" id="tempValue">--°C</div><div class="data-sub" id="tempSub">--</div></div>
      <div class="data-card"><div class="data-label">Humidity</div><div class="data-value" id="humidityValue">--%</div><div class="data-sub" id="humiditySub">--</div></div>
    </div>
  </div>
</div>

<script>
const positions=['h1','h2','m1','m2','s1','s2'];
let current={h1:'0',h2:'0',m1:'0',m2:'0',s1:'0',s2:'0'};
let deferredInstall=null;
let slideIdx=0;
let slideTimer=null;
window._bgImages=[];

const bgEl=document.getElementById('bg');
const imagePanel=document.getElementById('imagePanel');
const gearEl=document.getElementById('gear');
const settingsEl=document.getElementById('settings');
const closeEl=document.getElementById('settingsClose');
const bgPicker=document.getElementById('bgPicker');
const bgSlideshow=document.getElementById('bgSlideshow');
const bgOpacity=document.getElementById('bgOpacity');
const clockColor=document.getElementById('clockColor');
const clockFont=document.getElementById('clockFont');
const clockBg=document.getElementById('clockBg');
const timeFormat=document.getElementById('timeFormat');
const dateColor=document.getElementById('dateColor');
const dateFont=document.getElementById('dateFont');
const dateBg=document.getElementById('dateBg');
const dateFormatEl=document.getElementById('dateFormat');
const resetBtn=document.getElementById('settingsReset');

function applySaved(){
  const imgs=localStorage.getItem('fcBgImages');
  if(imgs){try{window._bgImages=JSON.parse(imgs);}catch(e){window._bgImages=[];}}
  if(window._bgImages.length){
    slideIdx=0;
    imagePanel.style.backgroundImage='url('+window._bgImages[slideIdx]+')';
  }
  const op=localStorage.getItem('fcBgOpacity');
  if(op){bgOpacity.value=op;document.documentElement.style.setProperty('--bg-opacity',op/100);}
  const ss=localStorage.getItem('fcBgSlideshow');
  if(ss){bgSlideshow.value=ss;startSlideshow(ss);}

  const apply=(id,prop,key)=>{
    const v=localStorage.getItem(key);
    if(v){document.getElementById(id).value=v;document.documentElement.style.setProperty(prop,v);}
  };
  apply('clockColor','--clock-color','fcClockColor');
  apply('clockFont','--clock-font','fcClockFont');
  apply('clockBg','--clock-bg','fcClockBg');
  apply('timeFormat','--time-format','fcTimeFormat');
  apply('dateColor','--date-color','fcDateColor');
  apply('dateFont','--date-font','fcDateFont');
  apply('dateBg','--date-bg','fcDateBg');
  apply('dateFormat','--date-format','fcDateFormat');
}
applySaved();

function save(key,val){localStorage.setItem(key,val);}

gearEl.onclick=()=>settingsEl.classList.add('open');
closeEl.onclick=()=>settingsEl.classList.remove('open');
document.getElementById('settingsCloseBottom').onclick=()=>settingsEl.classList.remove('open');

bgPicker.addEventListener('change',e=>{
  const files=Array.from(e.target.files||[]);
  if(!files.length)return;
  const pending=files.length;
  const loaded=[];
  files.forEach(f=>{
    const r=new FileReader();
    r.onload=ev=>{
      loaded.push(ev.target.result);
      if(loaded.length===pending){
        const existing=window._bgImages||[];
        window._bgImages=[...existing,...loaded];
        localStorage.setItem('fcBgImages',JSON.stringify(window._bgImages));
        slideIdx=0;
        if(window._bgImages.length){imagePanel.style.backgroundImage='url('+window._bgImages[0]+')';}
        bgPicker.value='';
      }
    };
    r.readAsDataURL(f);
  });
});

bgSlideshow.addEventListener('change',e=>{
  save('fcBgSlideshow',e.target.value);
  startSlideshow(e.target.value);
});
bgOpacity.addEventListener('input',e=>{
  document.documentElement.style.setProperty('--bg-opacity',e.target.value/100);
  save('fcBgOpacity',e.target.value);
});

function startSlideshow(val){
  if(slideTimer){clearInterval(slideTimer);slideTimer=null;}
  if(val==='off'||!window._bgImages||!window._bgImages.length)return;
  const sec=parseInt(val);
  slideIdx=0;
  slideTimer=setInterval(()=>{
    if(!window._bgImages.length)return;
    slideIdx=(slideIdx+1)%window._bgImages.length;
    imagePanel.style.backgroundImage='url('+window._bgImages[slideIdx]+')';
  },sec*1000);
}

const clampColor=(id,prop,key)=>{
  const el=document.getElementById(id);
  el.addEventListener('input',e=>{
    document.documentElement.style.setProperty(prop,e.target.value);
    save(key,e.target.value);
  });
};
clampColor('clockColor','--clock-color','fcClockColor');
clampColor('clockBg','--clock-bg','fcClockBg');
clampColor('dateColor','--date-color','fcDateColor');
clampColor('dateBg','--date-bg','fcDateBg');

const clampFont=(id,prop,key)=>{
  const el=document.getElementById(id);
  el.addEventListener('change',e=>{
    document.documentElement.style.setProperty(prop,e.target.value);
    save(key,e.target.value);
  });
};
clampFont('clockFont','--clock-font','fcClockFont');
clampFont('dateFont','--date-font','fcDateFont');

timeFormat.addEventListener('change',e=>{save('fcTimeFormat',e.target.value);});
dateFormatEl.addEventListener('change',e=>{save('fcDateFormat',e.target.value);});

resetBtn.onclick=()=>{
  localStorage.clear();
  window._bgImages=[];
  slideIdx=0;
  imagePanel.style.backgroundImage='';
  location.reload();
};

document.getElementById('settingsSave').onclick=()=>{
  const btn=document.getElementById('settingsSave');
  const orig=btn.textContent;
  btn.textContent='Saved!';
  setTimeout(()=>btn.textContent=orig,800);
};

function buildClock(){
  const clock=document.getElementById('clock');
  clock.innerHTML='';
  positions.forEach((p,i)=>{
    if(i===2||i===4)clock.insertAdjacentHTML('beforeend','<div class="colon">:</div>');
    clock.insertAdjacentHTML('beforeend',`<div class="digit-group" id="g-${p}"><div class="card"><div class="face front">${current[p]}</div><div class="face back">${current[p]}</div><div class="axle"></div></div></div>`);
  });
}
function flip(p,newVal){
  const g=document.getElementById('g-'+p);if(!g)return;
  const card=g.querySelector('.card');const front=card.querySelector('.front');const back=card.querySelector('.back');
  if(front.textContent===newVal)return;
  back.textContent=newVal;card.style.transform='rotateX(180deg)';
  setTimeout(()=>{front.textContent=newVal;card.style.transform='rotateX(0deg)'},550);
}
function pad(n){return String(Math.floor(n)).padStart(2,'0');}

function fmtDate(now,fmt){
  const d=pad(now.getDate());
  const m=pad(now.getMonth()+1);
  const mon=now.toLocaleDateString('en-US',{month:'long'});
  const y=now.getFullYear();
  const yy=String(y).slice(-2);
  return fmt.replace('YYYY',y).replace('YY',yy).replace('MM',m).replace('Month',mon).replace('DD',d);
}

function moonPhase(date){
  const ref=new Date(2000,0,6,18,14,0);
  const days=(date-ref)/(1000*60*60*24);
  const synodic=29.530588853;
  const age=((days%synodic)+synodic)%synodic;
  const phaseIndex=Math.floor((age/synodic)*8)%8;
  const icons=['🌑','🌒','🌓','🌔','🌕','🌖','🌗','🌘'];
  const names=['New Moon','Waxing Crescent','First Quarter','Waxing Gibbous','Full Moon','Waning Gibbous','Last Quarter','Waning Crescent'];
  const illum=Math.round((1-Math.cos((age/synodic)*2*Math.PI))/2*100);
  return{icon:icons[phaseIndex],name:names[phaseIndex],illum};
}

function tick(){
  const now=new Date();
  let h=now.getHours(),m=now.getMinutes(),s=now.getSeconds();
  const use24=localStorage.getItem('fcTimeFormat')!=='12';
  if(!use24){let h12=h%12;h12=h12?h12:12;h=h12;}
  const vals={h1:pad(h)[0],h2:pad(h)[1],m1:pad(m)[0],m2:pad(m)[1],s1:pad(s)[0],s2:pad(s)[1]};
  positions.forEach(p=>{if(vals[p]!==current[p])flip(p,vals[p]);current[p]=vals[p];});
  document.getElementById('date').textContent=fmtDate(now,localStorage.getItem('fcDateFormat')||'DD:MM:YYYY');
  document.getElementById('ampm').textContent=use24?'':(now.getHours()>=12?'PM':'AM');
  const mp=moonPhase(now);
  document.getElementById('moonIcon').textContent=mp.icon;
  document.getElementById('moonLabel').textContent=mp.name;
  document.getElementById('moonIllum').textContent=mp.illum+'% illuminated';
}

window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredInstall=e;document.getElementById('banner').style.display='flex';});
document.getElementById('installBtn').onclick=async()=>{if(deferredInstall){deferredInstall.prompt();deferredInstall=null;document.getElementById('banner').style.display='none';}};

buildClock();tick();setInterval(tick,1000);

navigator.geolocation.getCurrentPosition(p=>{
  const lat=p.coords.latitude,lon=p.coords.longitude;
  fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,relative_humidity_2m,apparent_temperature,precipitation,weather_code,wind_speed_10m,wind_direction_10m&hourly=temperature_2m,weather_code&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max,sunrise,sunset&timezone=auto`)
  .then(r=>r.json()).then(d=>{
    const cur=d.current;
    document.getElementById('tempValue').textContent=Math.round(cur.temperature_2m)+'°C';
    document.getElementById('tempSub').textContent='Live';
    document.getElementById('humidityValue').textContent=cur.relative_humidity_2m+'%';
    document.getElementById('humiditySub').textContent='Live';
    const sr=new Date(d.daily.sunrise[0]).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
    const ss=new Date(d.daily.sunset[0]).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
    document.getElementById('sunriseValue').textContent=sr;
    document.getElementById('sunsetValue').textContent=ss;
    document.getElementById('sunriseSub').textContent='Live';
    document.getElementById('sunsetSub').textContent='Live';
  }).catch(()=>{});
},()=>{});

function fitScale(){
  const c=document.getElementById('scale-container');
  const w=window.innerWidth,h=window.innerHeight;
  const dw=1024,dh=768;
  const s=Math.min(w/dw,h/dh);
  c.style.transform=`scale(${s})`;
  c.style.left=((w-dw*s)/2)+'px';
  c.style.top=((h-dh*s)/2)+'px';
}
window.addEventListener('resize',fitScale);
fitScale();

if('serviceWorker'in navigator){navigator.serviceWorker.register('sw.js').catch(()=>{});}
</script>
</div>
